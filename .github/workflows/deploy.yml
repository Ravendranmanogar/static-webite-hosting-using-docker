
name: Static Website CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get source code
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      # Step 2: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/static-website:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/static-website:${{ github.sha }}

      # Step 4: Deploy on AWS EC2
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/static-website:latest

            docker rm -f static-website-container || true

            docker run -d \
              --name static-website-container \
              --restart unless-stopped \
              -p 90:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/static-website:latest

            docker ps
